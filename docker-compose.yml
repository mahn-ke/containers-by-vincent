#http
version: "3.7"

services:
    portainer:
        image: portainer/portainer-ce:lts@sha256:18616fff2998f8ca0e8ebe7f028658ae1682859cf43f212f81a849c1093ad639
        container_name: portainer
        restart: always
        ports:
            - "8001:9000"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data

volumes:
    portainer_data:
