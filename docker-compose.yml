#http
version: "3.7"

services:
    portainer:
        image: portainer/portainer-ce:lts@sha256:03f94a406496dc84d37b552795fc424ccad8d0d7200353b6a82915f6e8f73ab0
        container_name: portainer
        restart: always
        ports:
            - "8001:9000"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data

volumes:
    portainer_data:
