#http
version: "3.7"

services:
    portainer:
        image: portainer/portainer-ce:lts@sha256:4d616db18cfeb5dd41a69c0958bc825c84483ea9cde1106eb82a5d26f3bd8b0e
        container_name: portainer
        restart: always
        ports:
            - "8001:9000"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data

volumes:
    portainer_data:
