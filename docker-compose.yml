#http
version: "3.7"

services:
    portainer:
        image: portainer/portainer-ce:lts@sha256:f6bc23d1695530a609563fd65c180aaafec0fc02e019d5fc63d16b6fbe83addd
        container_name: portainer
        restart: always
        ports:
            - "8001:9000"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data

volumes:
    portainer_data:
